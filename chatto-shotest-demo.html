function CTValidate(quiz){

  if(!Array.isArray(quiz.questions)||!quiz.questions.length)return '問題を1つ以上作ってください。';

    const q=quiz.questions[index],label=`問題${index+1}：`;
    if(!['single','multi','tf','sort','text','word_puzzle'].includes(q.type))return label+'形式を確認してください。';

    if(!Number.isFinite(q.points)||q.points<=0)return label+'配点を確認してください。';
    if(['single','multi','sort'].includes(q.type)&&(!Array.isArray(q.options)||q.options.length<2||q.options.some(value=>typeof value!=='string'||!value.trim())))return label+'選択肢をすべて入力してください。';

    if(q.type==='tf'&&typeof q.correct!=='boolean')return label+'○×の正解はtrueかfalseにしてください。';
    if(q.type==='multi'&&(!q.correct?.length||new Set(q.correct).size!==q.correct.length||q.correct.some(v=>!Number.isInteger(v)||v<0||v>=q.options.length)))return label+'正解を確認してください。';

    if(q.type==='text'&&(!Array.isArray(q.keywordRules)||!q.keywordRules.length||q.keywordRules.some(r=>typeof r.term!=='string'||!r.term.trim()||!Number.isFinite(r.points)||r.points<=0)))return label+'キーワードと点数を入力してください。';
    if(q.type==='word_puzzle'){
      if(typeof q.letterBank!=='string'||!q.letterBank.trim()||!Array.isArray(q.correctWords)||!q.correctWords.length||q.correctWords.some(v=>typeof v!=='string'||!v.trim()))return label+'文字と正解を入力してください。';
      for(const word of q.correctWords){const bank=[...CTAssessment.normalize(q.letterBank)];for(const char of CTAssessment.normalize(word)){const i=bank.indexOf(char);if(i<0)return label+'正解を作れる文字を入れてください。';bank.splice(i,1);}}

  }return '';
}

 const numeric=(q,value,unit='')=>{
   const n=Number,valueOf=x=>Number(n(x).toFixed(6));let wrong=[];
   let m;
   if((m=q.match(/([\d.]+)の([\d.]+)%は/))){const base=n(m[1]),percent=n(m[2]);wrong=[base-percent,percent,base*percent];}
   else if((m=q.match(/定価([\d.]+)円の([\d.]+)%引き/))){const base=n(m[1]),percent=n(m[2]),discount=base*percent/100;wrong=[discount,base+discount,base-percent];}
